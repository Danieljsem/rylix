<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ualyrics</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img class="logo" src="icons/icon-48.png" width="30" height="30" alt=""> <span>ualyrics</span></div>
    <form id="search" class="search" autocomplete="off">
      <input id="artist" name="artist" placeholder="Interpret" aria-label="Interpret" required maxlength="200">
      <input id="title" name="title" placeholder="Název skladby" aria-label="Název skladby" required maxlength="200">
      <button id="go" type="submit" aria-label="Vyhledat a romanizovat">
        <svg class="icon-search" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
        <span class="label">Hledat</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>
    </form>
    <span class="hint" id="providers"></span>
  </header>

  <main>
    <section id="stage" class="stage">
      <div class="aura" aria-hidden="true"><i></i><i></i><i></i></div>

      <div id="now" class="now" hidden>
        <img id="art" class="art" alt="" hidden>
        <div class="art art-fallback" id="art-fallback" aria-hidden="true">♪</div>
        <div class="now-text">
          <h1 id="song-title"></h1>
          <p><span id="song-artist"></span> <span id="badge" class="badge"></span></p>
        </div>
        <div class="now-actions">
          <div class="seg" role="tablist" aria-label="Zobrazení">
            <button type="button" class="seg-btn active" data-view="lyrics">Text</button>
            <button type="button" class="seg-btn" data-view="compare">Porovnání</button>
          </div>
          <button type="button" class="chip" id="toggle-original" aria-pressed="false" title="Zobrazit azbuku pod řádky">Azbuka</button>
          <button type="button" class="chip" id="toggle-sections" aria-pressed="false" title="Zobrazit názvy sekcí">Sekce</button>
          <button type="button" class="chip solid" id="copy" title="Zkopírovat celý text v latince">Kopírovat</button>
        </div>
      </div>

      <div id="message" class="message" hidden></div>
      <div id="warnings" class="warnings"></div>

      <div id="lyrics" class="lyrics" tabindex="-1">
        <div id="lyrics-inner" class="lyrics-inner">
          <p class="line welcome">Napiš interpreta a název skladby.</p>
          <p class="line welcome">Azbukou i latinkou,</p>
          <p class="line welcome">text se přepíše řádek po řádku.</p>
        </div>
      </div>

      <div id="compare" class="compare" hidden>
        <div class="compare-grid">
          <div class="col-head">Originál</div>
          <div class="col-head">Romanizace</div>
          <div id="grid-body" class="grid-body"></div>
        </div>
      </div>

      <button type="button" id="resync" class="resync" hidden>↻ Synchronizovat</button>
    </section>

    <details id="info" class="info" hidden>
      <summary>Info o zdroji a kontrole</summary>
      <dl class="stats" id="stats"></dl>
      <div class="info-actions">
        <button type="button" class="chip" id="copy-original">Kopírovat originál</button>
      </div>
    </details>
  </main>

  <footer id="player" class="player" hidden>
    <button type="button" id="play" class="play" aria-label="Přehrát">
      <svg viewBox="0 0 24 24" class="i-play" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      <svg viewBox="0 0 24 24" class="i-pause" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
    </button>
    <div class="timeline">
      <span id="time" class="time">0:00</span>
      <input id="seek" type="range" min="0" max="0" value="0" step="100" aria-label="Posun v čase">
      <span id="duration" class="time">0:00</span>
    </div>
    <div class="offset" title="Když text předbíhá nebo se opožďuje za hudbou">
      <button type="button" id="offset-minus" class="chip small">−0,5 s</button>
      <span id="offset" class="time">0,0 s</span>
      <button type="button" id="offset-plus" class="chip small">+0,5 s</button>
    </div>
  </footer>

  <div id="toast" class="toast" hidden></div>
  <script src="app.js" type="module"></script>
</body>
</html>
